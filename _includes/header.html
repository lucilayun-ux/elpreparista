{% if page.lang == "en" %}{% assign home = "/en" %}{% else %}{% assign home = "/" %}{% endif %}
{% include alt.html %}
<header class="top">
  <div class="wrap">
    <a class="logo" href="{{ home }}" aria-label="{% if page.lang == 'en' %}El Preparista, home{% else %}El Preparista, inicio{% endif %}">
      <img src="/logo.png" alt="" width="40" height="40">
      <span>EL PREPARISTA</span>
    </a>
    {% if page.lang == "en" %}
    <nav class="links" aria-label="Sections">
      <a href="/en#kits">Kits</a>
      <a href="/en#complementos">Add-ons</a>
      <a href="/en#reposicion">Restocking</a>
      <a href="/en#faq">FAQ</a>
      <a href="/en/blog/" aria-current="page">Blog</a>
    </nav>
    <div class="hdr-act">
      <a class="lang" href="{{ alt_url | default: '/blog/' }}" hreflang="es" lang="es" aria-label="Versión en español">ES</a>
      <a class="btn red small" href="/en#kits">Choose kit</a>
    </div>
    {% else %}
    <nav class="links" aria-label="Secciones">
      <a href="/#kits">Kits</a>
      <a href="/#complementos">Complementos</a>
      <a href="/#reposicion">Reposición</a>
      <a href="/#faq">Preguntas</a>
      <a href="/blog/" aria-current="page">Blog</a>
    </nav>
    <div class="hdr-act">
      <a class="lang" href="{{ alt_url | default: '/en/blog/' }}" hreflang="en" lang="en" aria-label="English version">EN</a>
      <a class="btn red small" href="/#kits">Elegir kit</a>
    </div>
    {% endif %}
  </div>
</header>
